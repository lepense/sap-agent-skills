# mta.yaml excerpt — bind SAP Event Mesh (enterprise-messaging) to the CAP service.
modules:
  - name: bookshop-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: bookshop-db
      - name: bookshop-auth
      - name: bookshop-messaging

resources:
  - name: bookshop-messaging
    type: org.cloudfoundry.managed-service
    parameters:
      service: enterprise-messaging
      service-plan: default
      path: ./event-mesh.json   # namespace + queues/subscriptions

