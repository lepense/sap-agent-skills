# gen/chart/values.yaml override for Kyma deployment (excerpt).
# Generated by `cds add kyma`; adjust image names, registry, domain, and probes.
global:
  domain: my-cluster.kyma.ondemand.com
  imagePullSecret:
    name: my-registry-secret
  image:
    registry: my-registry.example.com

srv:
  image:
    repository: my-registry.example.com/bookshop-srv
    tag: latest
  resources:
    limits: { cpu: 500m, memory: 512Mi }
    requests: { cpu: 250m, memory: 256Mi }
  health:
    liveness: { path: /health/liveness }
    readiness: { path: /health/readiness }

hana-deployer:
  image:
    repository: my-registry.example.com/bookshop-db-deployer
    tag: latest
  bindings:
    db:
      serviceInstanceName: bookshop-db

xsuaa:
  serviceOfferingName: xsuaa
  servicePlanName: application
  parameters:
    xsappname: bookshop

approuter:
  image:
    repository: my-registry.example.com/bookshop-approuter
    tag: latest
